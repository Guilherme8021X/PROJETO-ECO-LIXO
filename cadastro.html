<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="Estilos/primeiro_estilo.css" rel="stylesheet" />
    <title>Cadastro de novo usuário</title>
    <style>
        /* Classes para as mensagens de validação */
        .erro { 
            color: #d9534f; 
            font-weight: bold; 
            margin-bottom: 15px; 
            padding: 10px;
            border: 1px solid #d9534f;
            background-color: #fdf7f7;
        }
        .sucesso { 
            color: #28a745; 
            font-weight: bold; 
            margin-bottom: 15px; 
            padding: 10px;
            border: 1px solid #28a745;
            background-color: #f4fdf5;
        }
    </style>
</head>
<body>
    <h2>Cadastro do Usuário</h2>
    
    <!-- Contêiner para exibir as mensagens no próprio formulário -->
    <div id="mensagem-validacao"></div>

    <!-- Adicionado o id "formCadastro" e corrigida a estrutura do botão -->
    <form id="formCadastro" action="#" method="post">
        <p><label for="nome">Nome:</label><br>
            <!-- Removido o 'required' nativo do HTML para testar a validação via JavaScript (Casos de dados vazios) -->
            <input type="text" id="nome" name="nome"></p>
            
        <p><label for="email">E-mail:</label><br>
            <input type="text" id="email" name="email"></p>
            
        <p><label for="tel">Telefone:</label><br>
            <input type="tel" id="tel" name="tel" placeholder="(81) 99999-9999"></p>
            
        <p><label for="nasc">Nascimento:</label><br>
            <input type="date" id="nasc" name="nasc"></p>
            
        <p><label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" placeholder="###.###.###-##"></p>
            
        <p><label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade" placeholder="Recife"></p>
            
        <p><label for="estado">Estado:</label><br>
            <input type="text" id="estado" name="estado" placeholder="PE"></p>
            
        <button type="submit">Se Cadastrar no sistema</button>
    </form>

    <p><a href="index.html" target="_blank" rel="noopener noreferrer">Voltar Para Menu Principal</a></p>

    <script>
        // 1. Captura o formulário e a div de mensagens
        const form = document.getElementById('formCadastro');
        const divMensagem = document.getElementById('mensagem-validacao');

        // Adiciona o ouvinte para o evento submit
        form.addEventListener('submit', function(event) {
            // Evita o recarregamento padrão da página
            event.preventDefault();

            // Leitura dos campos
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const cpf = document.getElementById('cpf').value.trim(); // Campo específico do projeto

            let erros = [];

            // 2. Regras de validação (3 validações distintas)
            if (nome === "" || nome.length < 3) {
                erros.push("O campo 'Nome' é obrigatório e deve ter no mínimo 3 caracteres.");
            }

            if (email === "" || !email.includes('@') || !email.includes('.')) {
                erros.push("Insira um endereço de 'E-mail' válido.");
            }

            if (cpf === "" || cpf.length < 11) {
                erros.push("O campo 'CPF' é obrigatório e deve conter no mínimo 11 dígitos.");
            }

            // 3. Exibição das mensagens com cor de erro ou sucesso
            divMensagem.innerHTML = ""; // Limpa mensagens anteriores
            divMensagem.className = ""; // Limpa classes anteriores

            if (erros.length > 0) {
                // Caso existam erros (Dados vazios ou errados)
                divMensagem.classList.add('erro');
                divMensagem.innerHTML = erros.join('<br>');
            } else {
                // Caso os dados estejam corretos
                divMensagem.classList.add('sucesso');
                divMensagem.innerHTML = "Cadastro validado e realizado com sucesso!";
                form.reset(); // Limpa os campos do formulário
            }
        });
    </script>
</body>
</html>

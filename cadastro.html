<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="Estilos/primeiro_estilo.css" rel="stylesheet" />
    <title>Cadastro de novo usuário</title>
</head>
<body>
    <h2>Cadastro do Usuário</h2>
    <form action="#" method="post">
        <p><label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required minlength="3"></p>
            
        <p><label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required></p>
            
        <p><label for="tel">Telefone:</label><br>
            <input type="tel" id="tel" name="tel" placeholder="(81) 99999-9999"></p>
            
        <p><label for="nasc">Nascimento:</label><br>
            <input type="date" id="nasc" name="nasc"></p>
            
        <p><label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" placeholder="###.###.###-##"></p>
            
        <p><label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade" placeholder="Recife"></p>
            
        <p><label for="estado">Estado:</label><br>
            <input type="text" id="estado" name="estado" placeholder="PE"></p>
    </form>

    <button type="submit"><a href="Index.html"> Se Cadastrar no sistema </a></button></form>
    <p><a href="index.html" target="_blank" rel="noopener noreferrer">Voltar Para Menu Principal</a></p></strong>.</p>
<script>
const form = document.getElementById('form');

const msg = document.getElementById('msg');

form.addEventListener('submit', (e) => {

e.preventDefault();

const nome = document.getElementById('nome').value.trim();

const email = document.getElementById('email').value.trim();

const telefone = document.getElementById('tel').value.trim();

const cpf = document.getElementById('cpf').value.trim();

if (nome.length < 3) {

msg.textContent = 'Informe o nome (mín. 3 letras).';
msg.className = 'erro';
return;

if (cpf.length < 8){
    msg.textContent = 'Informe seu CPF (8 números)';
    msg.className = 'erro';
    return;
}

if (telefone.length < 3){
    msg.textContent = 'Informe seu telefone';
    msg.className = 'erro';
    return;
}

if (!email.includes('@')) {

    msg.textContent = 'Informe um e-mail válido.';
    msg.className = 'erro';
    return;
}

msg.textContent = `Cadastro feito, ${nome}!`;

msg.className = 'ok';

form.reset();
}})
</script>
</body>
</html>
